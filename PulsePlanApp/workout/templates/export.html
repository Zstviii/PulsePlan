<form method="post" action="{% url 'export_data' %}" class="row g-3" data-download-form>{% csrf_token %}<div class="col-md-6">
<label class="form-label" for="export-from">От</label>
<input id="export-from" type="date" name="date_from" class="form-control">
</div>
<div class="col-md-6">
<label class="form-label" for="export-to">До</label>
<input id="export-to" type="date" name="date_to" class="form-control">
</div>
<div class="col-12">
<label class="form-label d-block">Данные</label>
<div class="form-check">
<input class="form-check-input" type="checkbox" name="workouts" id="workouts" checked>
<label class="form-check-label" for="workouts">Тренировки и упражнения</label>
</div>
<div class="form-check">
<input class="form-check-input" type="checkbox" name="calories" id="calories" checked>
<label class="form-check-label" for="calories">Расход калорий</label>
</div>
<div class="form-check">
<input class="form-check-input" type="checkbox" name="results" id="results" checked>
<label class="form-check-label" for="results">Результаты подходов</label>
</div>
<div class="form-check">
<input class="form-check-input" type="checkbox" name="templates" id="templates" checked>
<label class="form-check-label" for="templates">Шаблоны тренировок и упражнения</label>
</div>
</div>
<div class="col-md-6">
<label class="form-label" for="export-format">Формат</label>
<select id="export-format" name="format" class="form-select">
<option value="csv">CSV</option>
<option value="json">JSON</option>
</select>
</div>
<div class="col-12">
<button class="btn btn-primary">Экспортировать</button>
</div>
</form>
