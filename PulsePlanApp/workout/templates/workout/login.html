{% extends "workout/base.html" %}
{% load static %}
{% block title %}Вход — PulsePlan{% endblock %}
{% block content %}
<div class="auth-layout">
    <section class="auth-card">
        <img class="auth-brand-mark" src="{% static 'workout/img/pulseplan-symbol.png' %}" alt="" width="48" height="48">
        <h1 class="auth-title">Вход в личный кабинет</h1>
        <p class="auth-subtitle">Продолжите планирование тренировок</p>
        <form method="post" class="auth-form">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {{ form.as_p }}
            <button type="submit" class="btn-primary-action">Войти</button>
        </form>
        <p class="auth-switch"><a href="{% url 'password_reset' %}">Забыли пароль?</a></p>
        <p class="auth-switch">
            Нет аккаунта? <a href="{% url 'register' %}">Создать аккаунт</a>
        </p>
    </section>
</div>
{% endblock %}
