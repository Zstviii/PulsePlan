{% extends "workout/base.html" %}
{% block title %}Вход — PulsePlan{% endblock %}
{% block content %}
<div class="auth-layout">
    <section class="auth-card">
        <div class="auth-brand-mark">P</div>
        <h1 class="auth-title">Вход в личный кабинет</h1>
        <p class="auth-subtitle">Продолжите планирование тренировок</p>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-primary-action">Войти</button>
        </form>
        <p class="auth-switch">
            Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
        </p>
    </section>
</div>
{% endblock %}
