{% extends "workout/base.html" %}
{% block title %}Регистрация — PulsePlan{% endblock %}
{% block content %}
<div class="auth-layout">
    <section class="auth-card">
        <div class="auth-brand-mark">P</div>
        <h1 class="auth-title">Регистрация новичка</h1>
        <p class="auth-subtitle">Создайте профиль для планирования тренировок</p>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-primary-action">Создать профиль</button>
        </form>
        <p class="auth-switch">
            Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
        </p>
    </section>
</div>
{% endblock %}
