{% extends "workout/base.html" %}
{% block title %}Регистрация — PulsePlan{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h4 class="card-title mb-3 fw-bold">Регистрация новичка</h4>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100 mt-2">Создать профиль</button>
                </form>
                <hr>
                <p class="small text-muted mb-0 text-center">
                    Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
