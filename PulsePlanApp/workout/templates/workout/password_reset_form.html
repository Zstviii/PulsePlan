{% extends "workout/password_reset_base.html" %}
{% block recovery_content %}
<h1 class="auth-title">Восстановить доступ</h1>
<p class="auth-subtitle">Введите электронную почту, указанную в аккаунте.</p>
<form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary-action">Запросить ссылку</button>
</form>
<p class="auth-switch"><a href="{% url 'login' %}">Вернуться ко входу</a></p>
{% endblock %}
