{% extends "workout/password_reset_base.html" %}
{% block recovery_content %}
{% if validlink %}
    <h1 class="auth-title">Задать новый пароль</h1>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary-action">Сменить пароль</button>
    </form>
{% else %}
    <h1 class="auth-title">Ссылка недействительна</h1>
    <p>Срок действия ссылки мог истечь, или пароль уже был изменён.</p>
    <a class="btn btn-primary-action" href="{% url 'password_reset' %}">Запросить новую ссылку</a>
{% endif %}
{% endblock %}
