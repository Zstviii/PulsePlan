<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PulsePlan — Дневник тренировок{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; }
        .cal-cell { min-height: 120px; vertical-align: top; width: 14.28%; transition: background 0.15s; }
        .cal-cell:hover { background-color: #f1f5f9; }
        .cal-selected { outline: 2px solid #2563eb; background-color: #eff6ff !important; }
        .cal-today { border-top: 3px solid #16a34a !important; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">⚡ PulsePlan - тренируйся!</a>
        <div class="d-flex align-items-center gap-3">
            {% if user.is_authenticated %}
                <span class="text-light small">Профиль: <strong>{{ user.username }}</strong></span>
                <form method="post" action="{% url 'logout' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Войти</a>
                <a href="{% url 'register' %}" class="btn btn-primary btn-sm">Регистрация</a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container pb-5">
     {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
