{% extends "workout/base.html" %}
{% block title %}Экспорт данных — PulsePlan{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h1 class="h3">Экспорт данных</h1><p class="text-muted">Выберите период, данные и формат. Файл формируется только из ваших данных.</p>
<form method="post" class="row g-3">{% csrf_token %}<div class="col-md-6"><label class="form-label">От</label><input type="date" name="date_from" class="form-control"></div><div class="col-md-6"><label class="form-label">До</label><input type="date" name="date_to" class="form-control"></div>
<div class="col-12"><label class="form-label d-block">Данные</label><div class="form-check"><input class="form-check-input" type="checkbox" name="workouts" id="workouts" checked><label class="form-check-label" for="workouts">Тренировки и упражнения</label></div><div class="form-check"><input class="form-check-input" type="checkbox" name="calories" id="calories" checked><label class="form-check-label" for="calories">Расход калорий</label></div><div class="form-check"><input class="form-check-input" type="checkbox" name="results" id="results" checked><label class="form-check-label" for="results">Результаты подходов</label></div><div class="form-check"><input class="form-check-input" type="checkbox" name="templates" id="templates" checked><label class="form-check-label" for="templates">Шаблоны тренировок и упражнения</label></div></div>
<div class="col-md-6"><label class="form-label">Формат</label><select name="format" class="form-select"><option value="csv">CSV</option><option value="json">JSON</option></select></div><div class="col-12"><button class="btn btn-primary">Экспортировать</button></div></form>
</div></div></div></div>
{% endblock %}
